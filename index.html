<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvard University Postcard</title>
<style>
  :root {
    --shadow: rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px 80px;
    background: #2a2a2a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #eee6d3;
  }
  
  .stage {
    perspective: 2000px;
    width: 100%;
    max-width: 750px;
    margin-top: 40px;
  }
  
  .postcard {
    position: relative;
    width: 100%;
    aspect-ratio: 1.41 / 1; 
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  
  .postcard.flipped { 
    transform: rotateY(180deg); 
  }
  
  .face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 10px 30px var(--shadow);
    overflow: hidden;
    border-radius: 4px;
  }
  
  /* --- FRONT OF POSTCARD --- */
  .face.front {
    background: #000;
    transform: rotateY(0deg);
  }
  .face.front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- BACK OF POSTCARD --- */
  .face.back {
    transform: rotateY(180deg);
    background: url('1787039987555.jpg') no-repeat center center;
    background-size: cover;
  }

  /* Interactive Message Area (Left Side, Below Printed Text) */
  .message-area {
    position: absolute;
    top: 20%;
    left: 3%;
    width: 44%;
    height: 65%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Comic Sans MS', 'Caveat', cursive, sans-serif;
    font-size: 13.5px;
    color: #111;
    line-height: 1.5;
    padding: 5px;
  }
  
  .message-area::placeholder {
    color: #888;
    font-family: Arial, sans-serif;
    font-size: 12px;
  }

  /* Stamp Box Overlay (Top Right Circle) */
  .stamp-link {
    position: absolute;
    top: 5%;
    right: 5%;
    width: 15%;
    height: 21%;
    display: block;
    border: 2px dashed transparent;
    border-radius: 50%; /* Made circular to match the printed logo */
    transition: all 0.2s ease;
    z-index: 10;
  }

  .stamp-link:hover {
    border-color: rgba(0, 102, 204, 0.6);
    background: rgba(0, 102, 204, 0.08);
  }

  /* Address Lines Overlay (Right Side Bottom - 5 Lines) */
  .address-container {
    position: absolute;
    top: 58%;
    right: 4%;
    width: 42%;
    display: flex;
    flex-direction: column;
    gap: 15px; /* Spaced to align with the 5 printed lines */
  }

  .address-input {
    border: none;
    background: transparent;
    outline: none;
    font-family: 'Comic Sans MS', 'Caveat', cursive, sans-serif;
    font-size: 14px;
    color: #111;
    padding: 0 4px;
    width: 100%;
    height: 20px;
  }

  .instructions {
    margin-top: 30px;
    font-size: 14px;
    color: #999;
    font-family: monospace;
    text-align: center;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="postcard" id="postcard" onclick="toggleFlip(event)">
    
    <!-- Front of Postcard -->
    <div class="face front">
      <img src="1787039093831.jpg" alt="Harvard University Postcard Front">
    </div>
    
    <!-- Back of Postcard -->
    <div class="face back">
      
      <!-- Interactive Message Box (Left Side) -->
      <textarea class="message-area" placeholder="Write your personal message here..."> – Cambridge, Massachusets - 25/07/2026

Điểm dừng chân ngày thứ ba của chuyến đi là tiểu bang Massachusets, với ba địa điểm là Đại học Harvard, MIT và thành phố Boston.

Thành phố Cambridge là nơi tọa lạc của hai trường đại học top đầu thế giới - Harvard và MIT. Dù cả hai trường cách nhau một điểm dừng xe buýt (1.4 miles),
nhưng cả hai ngôi trường này lại theo xu hướng khác nhau hoàn toàn. Nếu Harvard mang đến cho học sinh nét cổ kính, kiến trúc 

</textarea>

      <!-- Clickable Circular Stamp Overlay (Top Right) -->
      <a class="stamp-link" href="https://anguyen1601.github.io/Yale/album.html" target="_blank" title="Click to view album/video"></a>
      
      <!-- Interactive Address Lines Overlay (Right Side - 5 Lines) -->
      <div class="address-container">
        <input type="text" class="address-input" placeholder="To My Special Person">
        <input type="text" class="address-input" placeholder="Harvard University">
        <input type="text" class="address-input" placeholder="Cambridge, MA">
        <input type="text" class="address-input" placeholder="United States">
        <input type="text" class="address-input" placeholder="">
      </div>

    </div>
  </div>
</div>

<div class="instructions">
  Click the edges of the postcard to flip.<br>
  (Clicking text inputs or the stamp logo will interact with them without flipping!)
</div>

<script>
  function toggleFlip(e) {
    // Prevent flip if user clicks interactable elements
    if (
      e.target.tagName === 'TEXTAREA' || 
      e.target.tagName === 'INPUT' || 
      e.target.tagName === 'A' || 
      e.target.closest('a')
    ) {
      return;
    }
    document.getElementById('postcard').classList.toggle('flipped');
  }

  document.addEventListener('DOMContentLoaded', () => {
    const messageArea = document.querySelector('.message-area');
    const addressInputs = document.querySelectorAll('.address-input');

    // Restore saved text (supports saving blank values safely)
    const savedMessage = localStorage.getItem('harvard_postcard_message');
    if (savedMessage !== null) {
      messageArea.value = savedMessage;
    }
    
    addressInputs.forEach((input, index) => {
      const savedValue = localStorage.getItem(`harvard_postcard_input_${index}`);
      if (savedValue !== null) {
        input.value = savedValue;
      }
    });

    // Save changes automatically on input
    messageArea.addEventListener('input', () => {
      localStorage.setItem('harvard_postcard_message', messageArea.value);
    });

    addressInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        localStorage.setItem(`harvard_postcard_input_${index}`, input.value);
      });
    });
  });
</script>

</body>
</html>
